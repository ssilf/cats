<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Дянки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap">
<style>
:root{--bg:#efe9ee;--line:#d9ccd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060b;--line:#2b2236}}
:root[data-theme="dark"]{--bg:#07060b;--line:#2b2236}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);display:grid;place-items:center;min-height:100vh;padding:14px}
.stage{position:relative;width:min(980px,100%);height:min(92vh,900px);min-height:430px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#231326,#0a060d 60%,#020104)}
canvas{width:100%;height:100%;display:block}
.name{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#ffe1c9;font-family:"Marck Script",cursive;font-size:40px;text-shadow:0 0 18px #ff9a6e,0 2px 14px #000}
@media(max-width:600px){.name{font-size:32px}}
</style>
</head>
<body>
<div class="stage"><canvas id="c"></canvas><div class="name">Для Дянки</div></div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d');
const N=9500,TAU=Math.PI*2,chars=' .,:;irsXA253hMHGS#9B&@';
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
// ---------- примитивы ----------
const ell=(cx,cy,cz,rx,ry,rz,cf,R,fl=0)=>()=>{
 const a=R()*TAU,z=R()*2-1,q=Math.sqrt(1-z*z),d=[q*Math.cos(a),z,q*Math.sin(a)],j=1+fl*(R()-.5)*2;
 const p=[cx+rx*d[0]*j,cy+ry*d[1]*j,cz+rz*d[2]*j];
 return[...p,...norm([d[0]/rx,d[1]/ry,d[2]/rz]),...cf(p,d,R)];
};
const tube=(a,b,r,cf,R)=>()=>{
 const t=R(),g=R()*TAU,p=[a[0]+(b[0]-a[0])*t+r*Math.cos(g),a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t+r*Math.sin(g)];
 return[...p,Math.cos(g),0,Math.sin(g),...cf(t)];
};
// ---------- кошка ----------
function cat(B,R){
 const c=B.c,c2=B.c2,pt=B.pt,P=[],bw=B.bw,bh=B.bh,hr=B.hr,fl=B.fl,jit=k=>k.map(x=>x+(R()-.5)*16);
 const bc=(p,d)=>{let k=c;
  if(B.stripes&&Math.sin(p[1]*15+p[0]*5+Math.sin(p[2]*6)*2)>.4)k=k.map(x=>x*.58);
  return jit(mixc(k,c2,cl((d[2]-.15)*(d[1]<.5?1.4:0))));};
 const hc=(p,d)=>{let k=bc(p,d);if(pt)k=mixc(k,pt,cl((d[2]-.1)*1.5-Math.abs(d[0])*.4)*.9);return k};
 const lc=t=>jit(pt?mixc(c,pt,1-t):c2);
 // тело и задние лапы
 P.push([5*bw,ell(0,-.3,0,.5*bw,.8*bh,.45*bw,bc,R,fl)]);
 [-1,1].forEach(s=>{
  P.push([2*bw,ell(s*.42*bw,-1,-.1,.3*bw,.38,.5*bw,bc,R,fl)]);
  P.push([1.1,tube([s*.2,-.6,.38],[s*.2,-1.35,.5],.1*(.7+.3*bw),lc,R)]);
  P.push([.5,ell(s*.2,-1.4,.56,.14,.075,.17,()=>jit(pt?pt:c2),R,0)]);
 });
 if(B.ruff)P.push([1.6*B.ruff,ell(0,.32,.28,.5*B.ruff,.38*B.ruff,.38*B.ruff,bc,R,.45)]);
 // голова
 const hz=.12,fz=.33*hr;
 P.push([3.5*hr*hr,ell(0,.78,hz,.46*hr,.4*hr,.4*hr,hc,R,fl)]);
 P.push([.5,ell(0,.66,hz+fz*(1-.3*B.flat)+.02,.16*hr,.12*hr,.12*hr,()=>jit(pt?pt:c2),R,0)]);
 P.push([.12,ell(0,.69,hz+fz*(1-.3*B.flat)+.12*hr,.05,.035,.03,()=>[240,120,140],R,0)]);
 [-1,1].forEach(s=>{
  const er=B.er||1,ez=hz+.3*hr;
  P.push([.4*er,ell(s*.2*hr,.82,ez,.075*er,.09*er,.05,()=>jit(B.eye),R,0)]);
  P.push([.15,ell(s*.2*hr,.82,ez+.04,.022,.07*er,.02,()=>[12,8,10],R,0)]);
  // уши
  const ax=norm(B.fold?[s*.5,.1,.9]:[s*.3,1,-.12]),h=B.eh*(B.fold?.6:1),u=norm(cross(ax,[0,0,1])),v=cross(ax,u),b=[s*.3*hr,.78+.3*hr,.05];
  P.push([.8*B.ew*B.eh*hr,()=>{
   const t=1-Math.sqrt(R()),a=R()*TAU,rr=.2*B.ew*hr*(1-t),o=[u[0]*Math.cos(a)*rr+v[0]*Math.sin(a)*rr*.45,u[1]*Math.cos(a)*rr+v[1]*Math.sin(a)*rr*.45,u[2]*Math.cos(a)*rr+v[2]*Math.sin(a)*rr*.45];
   const inner=(o[2]>0&&t>.1&&!B.fold);
   const col=pt?mixc(pt,[200,120,120],inner?.3:0):mixc(c,[245,150,160],inner?.75*(1-t):0);
   return[b[0]+ax[0]*h*t+o[0],b[1]+ax[1]*h*t+o[1],b[2]+ax[2]*h*t+o[2],...norm(o),...jit(col)];}]);
 });
 // усы
 if(B.wh!==0)P.push([.9,()=>{
  const s=R()<.5?-1:1,j=(R()*3|0)-1,t=R(),z0=hz+fz*(1-.3*B.flat)+.08*hr,
  p=[s*(.1+.5*t)*hr,.66+j*.03+j*.08*t,z0+.18*t];
  return[...p,0,0,1,235,235,240];}]);
 // хвост
 const tl=B.tl;
 P.push([16*tl*B.tr,()=>{
  const t=R(),a=R()*TAU,z=R()*2-1,q=Math.sqrt(1-z*z),d=[q*Math.cos(a),z,q*Math.sin(a)],r=B.tr*(.85+.4*t)*(1+fl*(R()-.5)*2);
  const p=[.3+.75*Math.sin(t*1.9)*Math.sqrt(tl)+r*d[0],-1.3+1.9*tl*.8*Math.pow(t,1.2)+r*d[1],-.55+.25*Math.sin(t*3)+r*d[2]];
  let k=c;if(B.stripes&&Math.sin(t*28)>.3)k=k.map(x=>x*.58);if(pt)k=mixc(k,pt,cl((t-.35)*2));
  return[...p,...d,...jit(k)];}]);
 // подушка
 P.push([2.6,()=>{const r=1.5*Math.sqrt(R()),a=R()*TAU,f=r/1.5;
  return[r*Math.cos(a),-1.5+.14*Math.pow(f,4),r*Math.sin(a),0,1,0,...mixc([140,40,90],[225,100,150],f).map(x=>x+(R()-.5)*16)];}]);
 return P;
}
const D={bw:1,bh:1,hr:1,flat:0,ew:1,eh:.6,tl:1,tr:.1,fl:.04,ruff:0,fold:0,stripes:0,pt:null,er:1};
const breeds=[
 {c:[125,140,165],c2:[160,175,195],bw:1.25,bh:.95,hr:1.15,ew:.8,eh:.45,tl:.6,tr:.13,eye:[255,170,40]},                       // британская
 {c:[240,225,200],c2:[240,225,200],pt:[75,48,42],bw:.8,bh:1.1,hr:.9,ew:1.2,eh:.85,tl:1.2,tr:.08,eye:[90,170,255]},             // сиамская
 {c:[155,108,62],c2:[225,205,170],stripes:1,bw:1.3,bh:1.15,hr:1.1,ew:1.1,eh:.8,ruff:1.2,tl:1.3,tr:.2,fl:.22,eye:[140,220,90]}, // мейн-кун
 {c:[228,172,150],c2:[240,190,170],bw:.8,bh:1,hr:.95,ew:1.6,eh:1.1,tl:1.2,tr:.06,fl:0,wh:0,er:1.25,eye:[200,230,80]},          // сфинкс
 {c:[250,240,225],c2:[255,250,240],flat:1,bw:1.3,bh:1,hr:1.2,ew:.7,eh:.4,ruff:1,tl:.8,tr:.22,fl:.3,eye:[255,140,30]},          // персидская
 {c:[170,176,188],c2:[205,210,220],stripes:1,fold:1,bw:1.1,bh:1,hr:1.2,ew:1,eh:.5,tl:.9,tr:.12,eye:[255,190,60]},              // вислоухая
 {c:[225,130,50],c2:[250,215,170],stripes:1,bw:1,bh:1,hr:1,ew:.9,eh:.6,tl:1.1,tr:.13,fl:.08,eye:[120,215,110]}                 // рыжий
];
function gen(parts){
 const sum=parts.reduce((a,p)=>a+p[0],0),P=new Float32Array(N*3),Nn=new Float32Array(N*3),C=new Float32Array(N*3),tmp=[];
 let i=0;
 parts.forEach((p,k)=>{const cnt=k===parts.length-1?N-i:Math.round(N*p[0]/sum);for(let j=0;j<cnt&&i<N;j++,i++)tmp.push(p[1]())});
 while(tmp.length<N)tmp.push(tmp[tmp.length-1]);
 tmp.sort((a,b)=>(Math.floor(a[1]*14)*10+(Math.atan2(a[2],a[0])+Math.PI)/TAU*9.99)-(Math.floor(b[1]*14)*10+(Math.atan2(b[2],b[0])+Math.PI)/TAU*9.99));
 tmp.forEach((q,j)=>{P.set(q.slice(0,3),j*3);Nn.set(q.slice(3,6),j*3);C.set(q.slice(6,9),j*3)});
 return{P,N:Nn,C};
}
const shapes=breeds.map((b,i)=>gen(cat({...D,...b},rng(100+i*13))));
const M=shapes.length,Rm=rng(99),dl=new Float32Array(N),rv=new Float32Array(N*3);
for(let i=0;i<N;i++){dl[i]=Rm()*.42;rv[i*3]=Rm()-.5;rv[i*3+1]=Rm()-.5;rv[i*3+2]=Rm()-.5}
// ---------- Рендер ----------
let W,H,cols,rows,cw,chh,zb,chb,rb,gb,bb,ab,last=0,clock=0,mxx=0,tx=0;
const HOLD=3.4,TRANS=2.4,CYC=HOLD+TRANS,Lv=norm([-.4,.7,.65]);
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=c.width=Math.floor(r.width*d);H=c.height=Math.floor(r.height*d)}
addEventListener('resize',resize);resize();
function draw(time){
 requestAnimationFrame(draw);
 const dt=Math.min((time-last)/1000||0,.05);last=time;clock+=dt;mxx+=(tx-mxx)*.05;
 const idx=Math.floor(clock/CYC),loc=clock-idx*CYC,T=loc<HOLD?0:(loc-HOLD)/TRANS,A=shapes[idx%M],B=shapes[(idx+1)%M];
 const cell=9*(devicePixelRatio||1);
 cw=cell*.62;chh=cell;cols=Math.ceil(W/cw);rows=Math.ceil(H/chh);
 if(!zb||zb.length!==cols*rows){const n=cols*rows;zb=new Float32Array(n);chb=new Uint8Array(n);rb=new Uint8Array(n);gb=new Uint8Array(n);bb=new Uint8Array(n);ab=new Float32Array(n)}
 zb.fill(-1e9);
 const scale=Math.min(W/3.7,H/4),yaw=1.25*Math.sin(clock*.45)+mxx*.5,pitch=.1+.07*Math.sin(clock*.6),
  cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp2=Math.sin(pitch);
 const aP=A.P,bP=B.P,aN=A.N,bN=B.N,aC=A.C,bC=B.C;
 for(let i=0;i<N;i++){
  const o=i*3;let e=0;
  if(T>0){const l=cl((T-dl[i])/.58);e=l*l*(3-2*l)}
  let x=aP[o]+(bP[o]-aP[o])*e,y=aP[o+1]+(bP[o+1]-aP[o+1])*e,z=aP[o+2]+(bP[o+2]-aP[o+2])*e;
  const nx=aN[o]+(bN[o]-aN[o])*e,ny=aN[o+1]+(bN[o+1]-aN[o+1])*e,nz=aN[o+2]+(bN[o+2]-aN[o+2])*e;
  if(e>0&&e<1){
   const s=Math.sin(Math.PI*e),w=s*(1.3+rv[o]*1.6),cs=Math.cos(w),sn=Math.sin(w);
   const x2=x*cs+z*sn,z2=-x*sn+z*cs;x=x2+rv[o]*s*.6;z=z2+rv[o+2]*s*.6;y+=rv[o+1]*s*.7+s*.12;
  }
  const yy=y-.1,px=x*cy+z*sy,pz=-x*sy+z*cy,py=yy*cp-pz*sp2,pzz=yy*sp2+pz*cp;
  const per=4.5/(4.5-pzz),sx=W/2+px*scale*per,sY=H/2-py*scale*per;
  const col=Math.floor(sx/cw),row=Math.floor(sY/chh);
  if(col<0||col>=cols||row<0||row>=rows)continue;
  const k=row*cols+col;if(pzz<=zb[k])continue;
  const qx=nx*cy+nz*sy,qz=-nx*sy+nz*cy,qy=ny*cp-qz*sp2,qz2=ny*sp2+qz*cp,nl=Math.hypot(qx,qy,qz2)||1;
  const light=Math.min(1,.18+.82*Math.abs((qx*Lv[0]+qy*Lv[1]+qz2*Lv[2])/nl)),f=.4+.75*light;
  zb[k]=pzz;chb[k]=Math.floor(light*(chars.length-1));
  rb[k]=Math.min(255,(aC[o]+(bC[o]-aC[o])*e)*f);gb[k]=Math.min(255,(aC[o+1]+(bC[o+1]-aC[o+1])*e)*f);bb[k]=Math.min(255,(aC[o+2]+(bC[o+2]-aC[o+2])*e)*f);
  ab[k]=.55+light*.45;
 }
 ctx.globalAlpha=1;ctx.fillStyle='#050308';ctx.fillRect(0,0,W,H);
 ctx.font=cell+'px "Fira Code",Consolas,monospace';ctx.textBaseline='top';
 for(let k=0;k<zb.length;k++){if(zb[k]<=-1e8)continue;
  ctx.globalAlpha=ab[k];ctx.fillStyle='rgb('+rb[k]+','+gb[k]+','+bb[k]+')';
  ctx.fillText(chars[chb[k]],(k%cols)*cw,Math.floor(k/cols)*chh);}
 ctx.globalAlpha=1;
 const g=ctx.createRadialGradient(W/2,H/2,scale*.1,W/2,H/2,scale*1.6);
 g.addColorStop(0,'rgba(255,150,110,.08)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
requestAnimationFrame(draw);
c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2});
c.addEventListener('pointerleave',()=>{tx=0});
})();
</script>
</body>
</html>
